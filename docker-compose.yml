version: '3.8'

services:
  arima-forecasting:
    build:
      context: .
      dockerfile: docker/Dockerfile.arima
    container_name: arima-forecasting
    ports:
      - "8000:8007"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - PORT=8007
      - HOST=0.0.0.0
    volumes:
      - ./data:/data
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  analytics-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.analytics
    container_name: analytics-api
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - PORT=8002
      - HOST=0.0.0.0
    volumes:
      - ./data:/data
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    depends_on:
      - arima-forecasting

networks:
  trading-network:
    driver: bridge

volumes:
  data:
    driver: local
  models:
    driver: local
