---
# TimesFM Kubernetes Deployment with S3 Persistent Volume
# For RunPod.io GPU cluster deployment

apiVersion: v1
kind: Namespace
metadata:
  name: timeseries-forecasting

---
# S3 Secret for AWS credentials
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: timeseries-forecasting
type: Opaque
stringData:
  aws-access-key: "" # Set your AWS access key
  aws-secret-key: "" # Set your AWS secret key
  s3-bucket: ""      # Set your S3 bucket name
  s3-region: "us-east-1"

---
# ConfigMap for TimesFM configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: timesfm-config
  namespace: timeseries-forecasting
data:
  log_level: "INFO"
  model_cache_dir: "/models"
  data_dir: "/data"
  max_workers: "4"

---
# PersistentVolumeClaim for S3 data (requires CSI S3 driver on cluster)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: timesfm-s3-pvc
  namespace: timeseries-forecasting
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: s3  # Requires CSI S3 driver configured on cluster
  resources:
    requests:
      storage: 100Gi

---
# TimesFM API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timesfm-api
  namespace: timeseries-forecasting
  labels:
    app: timesfm-api
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: timesfm-api
  template:
    metadata:
      labels:
        app: timesfm-api
        version: v1
    spec:
      serviceAccountName: timeseries-sa

      # Pull image from registry
      imagePullSecrets:
        - name: docker-registry-credentials

      containers:
        - name: timesfm-api
          image: your-registry/timesfm-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Environment variables from ConfigMap and Secret
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: timesfm-config
                  key: log_level
            - name: MODEL_CACHE_DIR
              valueFrom:
                configMapKeyRef:
                  name: timesfm-config
                  key: model_cache_dir
            - name: DATA_DIR
              valueFrom:
                configMapKeyRef:
                  name: timesfm-config
                  key: data_dir
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: aws-access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: aws-secret-key
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: s3-region
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: s3-bucket
            - name: PYTHONUNBUFFERED
              value: "1"

          # Volume mounts
          volumeMounts:
            - name: data-volume
              mountPath: /data
            - name: models-volume
              mountPath: /models

          # Resource limits
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
              nvidia.com/gpu: "1"  # For RunPod GPU
            limits:
              memory: "4Gi"
              cpu: "2000m"
              nvidia.com/gpu: "1"

          # Health checks
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Graceful shutdown
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]

      # Volumes
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: timesfm-s3-pvc
        - name: models-volume
          emptyDir:
            sizeLimit: 50Gi

---
# Service for TimesFM API
apiVersion: v1
kind: Service
metadata:
  name: timesfm-api-service
  namespace: timeseries-forecasting
  labels:
    app: timesfm-api
spec:
  type: ClusterIP
  selector:
    app: timesfm-api
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000

---
# Service for external access (LoadBalancer)
apiVersion: v1
kind: Service
metadata:
  name: timesfm-api-lb
  namespace: timeseries-forecasting
spec:
  type: LoadBalancer
  selector:
    app: timesfm-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: timesfm-api-hpa
  namespace: timeseries-forecasting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: timesfm-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ServiceAccount for RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: timeseries-sa
  namespace: timeseries-forecasting

---
# Role for ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: timeseries-role
  namespace: timeseries-forecasting
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: timeseries-rolebinding
  namespace: timeseries-forecasting
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: timeseries-role
subjects:
  - kind: ServiceAccount
    name: timeseries-sa
    namespace: timeseries-forecasting
