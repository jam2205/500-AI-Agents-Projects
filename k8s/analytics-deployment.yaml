---
# Analytics Service Kubernetes Deployment
# For RunPod.io cluster deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  namespace: timeseries-forecasting
  labels:
    app: analytics-api
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: analytics-api
  template:
    metadata:
      labels:
        app: analytics-api
        version: v1
    spec:
      serviceAccountName: timeseries-sa

      imagePullSecrets:
        - name: docker-registry-credentials

      containers:
        - name: analytics-api
          image: your-registry/analytics-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8002
              protocol: TCP

          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: timesfm-config
                  key: log_level
            - name: PORT
              value: "8002"
            - name: HOST
              value: "0.0.0.0"
            - name: PYTHONUNBUFFERED
              value: "1"

          volumeMounts:
            - name: data-volume
              mountPath: /data

          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]

      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: timesfm-s3-pvc

---
# Service for Analytics API (internal)
apiVersion: v1
kind: Service
metadata:
  name: analytics-api-service
  namespace: timeseries-forecasting
  labels:
    app: analytics-api
spec:
  type: ClusterIP
  selector:
    app: analytics-api
  ports:
    - name: http
      protocol: TCP
      port: 8002
      targetPort: 8002

---
# Service for external access
apiVersion: v1
kind: Service
metadata:
  name: analytics-api-lb
  namespace: timeseries-forecasting
spec:
  type: LoadBalancer
  selector:
    app: analytics-api
  ports:
    - name: http
      protocol: TCP
      port: 8002
      targetPort: 8002

---
# Horizontal Pod Autoscaler for Analytics
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analytics-api-hpa
  namespace: timeseries-forecasting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analytics-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
