---
# PatchTST Kubernetes Deployment with S3 Persistent Volume
# For RunPod.io GPU cluster deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: patchtst-api
  namespace: timeseries-forecasting
  labels:
    app: patchtst-api
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: patchtst-api
  template:
    metadata:
      labels:
        app: patchtst-api
        version: v1
    spec:
      serviceAccountName: timeseries-sa

      imagePullSecrets:
        - name: docker-registry-credentials

      containers:
        - name: patchtst-api
          image: your-registry/patchtst-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8001
              protocol: TCP

          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: timesfm-config
                  key: log_level
            - name: MODEL_CACHE_DIR
              valueFrom:
                configMapKeyRef:
                  name: timesfm-config
                  key: model_cache_dir
            - name: DATA_DIR
              valueFrom:
                configMapKeyRef:
                  name: timesfm-config
                  key: data_dir
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: aws-access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: aws-secret-key
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: s3-region
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: s3-bucket
            - name: PYTHONUNBUFFERED
              value: "1"

          volumeMounts:
            - name: data-volume
              mountPath: /data
            - name: models-volume
              mountPath: /models

          resources:
            requests:
              memory: "3Gi"
              cpu: "1500m"
              nvidia.com/gpu: "1"
            limits:
              memory: "6Gi"
              cpu: "2500m"
              nvidia.com/gpu: "1"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]

      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: timesfm-s3-pvc
        - name: models-volume
          emptyDir:
            sizeLimit: 50Gi

---
# Service for PatchTST API
apiVersion: v1
kind: Service
metadata:
  name: patchtst-api-service
  namespace: timeseries-forecasting
  labels:
    app: patchtst-api
spec:
  type: ClusterIP
  selector:
    app: patchtst-api
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001

---
# Service for external access
apiVersion: v1
kind: Service
metadata:
  name: patchtst-api-lb
  namespace: timeseries-forecasting
spec:
  type: LoadBalancer
  selector:
    app: patchtst-api
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001

---
# Horizontal Pod Autoscaler for PatchTST
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: patchtst-api-hpa
  namespace: timeseries-forecasting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: patchtst-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
